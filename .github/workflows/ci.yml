name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check permissive licenses
        run: bun run check:licenses

      - name: Check i18n symmetry
        run: bun run check:i18n

      - name: Check UI motion rules
        run: bun run check:motion

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run test suite
        run: bun test

      - name: Build web, plugins, and CLI
        run: bun run build:plugins && bun run build:web && bun run --filter @inkade/cli build

      - name: Run live API/MCP/SSE verification
        run: bun run verify:e2e
