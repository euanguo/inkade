<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" sizes="any" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>Inkade — ADE-Native Knowledge Hub</title>
    <script>
      (() => {
        try {
          const rawPrefs = localStorage.getItem("inkade:preferences:v1");
          const parsed = rawPrefs ? JSON.parse(rawPrefs) : null;
          const persisted = parsed && typeof parsed === "object" && parsed.state ? parsed.state : null;
          const urlTheme = new URLSearchParams(window.location.search).get("theme");
          const pref =
            urlTheme === "light" || urlTheme === "dark" || urlTheme === "system"
              ? urlTheme
              : persisted &&
                  (persisted.themePreference === "light" ||
                    persisted.themePreference === "dark" ||
                    persisted.themePreference === "system")
                ? persisted.themePreference
                : "system";
          const isDark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
          if (persisted && persisted.shellStyle) {
            document.documentElement.dataset.shell = persisted.shellStyle;
          }
          if (persisted && persisted.accentPreset) {
            document.documentElement.dataset.accent = persisted.accentPreset;
          }
          if (persisted && persisted.surfaceTheme) {
            document.documentElement.dataset.surface = persisted.surfaceTheme;
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
